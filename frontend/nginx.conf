# nginx del frontend (Ítems 3.3 y 6.2). Se copia a /etc/nginx/conf.d/default.conf.
# La configuración real está en nginx.conf.template: el entrypoint la procesa con envsubst al
# arrancar y la escribe en /tmp/default.conf (/tmp admite escritura: tmpfs en docker-compose con
# read_only, y disco efímero en Render).
# Si la plantilla no se genera, este include falla y nginx NO arranca (falla cerrado, nunca sirve
# la SPA sin el proxy de /api configurado).
include /tmp/default.conf;
