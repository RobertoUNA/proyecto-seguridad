# nginx del frontend (Ítem 3.3). Sirve la SPA y reenvía /api al backend interno.
# Corre como UID 101 en el puerto 8080 (no requiere privilegios para enlazar puertos < 1024).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas de seguridad. Se declaran solo en el nivel server: si un
    # location declara add_header propio, nginx descarta las heredadas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: el frontend solo consume /api del backend propio (KB, matriz de acceso).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ítem 7.2: se SOBRESCRIBE con la IP real de la conexión; nunca se agrega el valor que
        # envía el cliente (con $proxy_add_x_forwarded_for podría falsificar su actor_id).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA: rutas desconocidas vuelven a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
