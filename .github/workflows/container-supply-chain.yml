name: Contenedores SSDLC — Imagen candidata, Trivy y SBOM (Etapa 3)

# Ítem 3.3 (THR-05 / CTL-05) · Responsable: Brandon Corrales · Revisor: Roberto
# Workflow independiente de ci.yml: construye las imágenes candidatas, las analiza con
# Trivy (config + image) y genera el SBOM CycloneDX, todos ligados al SHA del commit.
# El job `policy-conftest` (ítem 3.4) se agrega en este mismo archivo.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

# Ítem 3.5: permisos mínimos para el GITHUB_TOKEN
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  container-scan:
    name: "3.3 Imagen candidata: Build, Trivy y SBOM"
    runs-on: ubuntu-24.04
    env:
      # En un PR se analiza el commit de la rama (head), no el merge commit sintético,
      # para que el SHA del reporte coincida con el código revisado.
      SCAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Ítem 3.5: acciones de terceros fijadas por SHA completo (mismas que ci.yml)
      - name: Checkout del commit analizado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SCAN_SHA }}
          persist-credentials: false

      # Mismo script que en local: una sola definición de qué se escanea y qué bloquea.
      # Trivy corre desde aquasec/trivy:0.76.2 fijada por digest (ver scripts/container-scan.sh).
      - name: Construir imágenes y ejecutar Trivy (config + image) + SBOM CycloneDX
        run: bash scripts/container-scan.sh "$SCAN_SHA"

      - name: Resumen del análisis en la ejecución
        if: always()
        run: |
          f="reports/container-scan-${SCAN_SHA}.json"
          if [[ -f "$f" ]]; then
            {
              echo "### Ítem 3.3 — Análisis de contenedores (\`${SCAN_SHA}\`)"
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::No se generó $f: el análisis no se ejecutó completo (INCOMPLETE = no aprobado)."
            exit 1
          fi

      - name: Conservar reportes de Trivy y SBOM como artefacto del commit
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: container-reports-${{ env.SCAN_SHA }}
          path: |
            reports/container-scan-*.json
            reports/trivy-*.json
            reports/sbom-*.cdx.json
          if-no-files-found: error
